name: CI
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: node --version && tmux -V
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
  macos:
    needs: linux
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install tmux
        run: brew install tmux
      - run: node --version && tmux -V
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
